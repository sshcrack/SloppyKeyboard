<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five-Cup Shuffle</title></head>
  <body>
    <main class="shuffle-window">
      <header><span>♠</span> SHELLGAME.EXE <small>REGISTERED TO: MYSTERY SLOT</small></header>
      <section class="table">
        <div class="marquee" id="message">FIRST, MEET THE CONSEQUENCES.</div>
        <div class="cups" id="cups">
          <button class="cup-wrap" data-cup="0" aria-label="Pixel Goose"><i class="cup"><b>1</b></i><em>PIXEL GOOSE</em></button>
          <button class="cup-wrap" data-cup="1" aria-label="Pointer spiral"><i class="cup"><b>2</b></i><em>POINTER SPIRAL</em></button>
          <button class="cup-wrap" data-cup="2" aria-label="Fallen balls"><i class="cup"><b>3</b></i><em>BALL AVALANCHE</em></button>
          <button class="cup-wrap" data-cup="3" aria-label="Desktop fracture"><i class="cup"><b>4</b></i><em>SCREEN RUPTURE</em></button>
          <button class="cup-wrap" data-cup="4" aria-label="Pixel creature"><i class="cup"><b>5</b></i><em>DESKTOP VISITOR</em></button>
        </div>
        <div class="hand" id="hand" aria-hidden="true"><i></i><b></b><span></span></div>
        <div class="table-edge">DO NOT PLACE BEVERAGES ON THE SHUFFLE SURFACE</div>
      </section>
      <footer><span id="timer">20</span> SECONDS REMAINING <b>● TRACKING ENABLED</b></footer>
    </main>
    <script src="./cup-shuffle.ts"></script>
  </body>
</html>
