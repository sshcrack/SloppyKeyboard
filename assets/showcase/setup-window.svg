  <text x="158" y="108" fill="#000" font-family="Tahoma, Verdana, sans-serif" font-size="15">This wizard installs approximately one keyboard and several poor decisions.</text>
  <text x="158" y="136" fill="#000080" font-family="Tahoma, Verdana, sans-serif" font-size="15" font-weight="700">Windows only. Obviously.</text>
  <rect x="0" y="178" width="960" height="37" fill="#c0c0c0"/>
  <path d="M0 178H960" stroke="#fff" stroke-width="3"/>
  <rect x="6" y="184" width="94" height="26" fill="#c0c0c0" stroke="#fff" stroke-width="3"/>
  <path d="M100 184V210H6" fill="none" stroke="#000" stroke-width="3"/>
  <text x="53" y="203" fill="#000" font-family="Tahoma, sans-serif" font-size="14" font-weight="700" text-anchor="middle">▣ Start</text>
  <rect x="111" y="184" width="275" height="26" fill="#e0e0e0" stroke="#808080" stroke-width="2"/>
  <text x="125" y="202" fill="#000" font-family="Tahoma, sans-serif" font-size="13">⌨  Sloppy Keyboard</text>
  <rect x="842" y="184" width="112" height="26" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
