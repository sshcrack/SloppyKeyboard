<svg xmlns="http://www.w3.org/2000/svg" width="960" height="215" viewBox="0 0 960 215" role="img" aria-labelledby="title desc">
  <title id="title">Sloppy Keyboard Setup Wizard</title>
  <desc id="desc">A Windows 95 setup window and taskbar.</desc>
  <rect x="3" y="3" width="954" height="162" fill="#c0c0c0" stroke="#000" stroke-width="3"/>
  <path d="M3 165V3H957" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="10" y="10" width="940" height="30" fill="#000080"/>
  <text x="22" y="31" fill="#fff" font-family="Tahoma, Verdana, sans-serif" font-size="16" font-weight="700">Sloppy Keyboard Setup Wizard</text>
  <rect x="20" y="54" width="110" height="94" fill="#fff"/>
  <rect x="43" y="76" width="64" height="52" rx="3" fill="#4040a0" stroke="#000" stroke-width="3"/>
  <rect x="51" y="82" width="48" height="25" fill="#c0c0c0"/>
  <circle cx="91" cy="119" r="4" fill="#fff"/>
