<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
  <title id="title">Sloppy Keyboard</title>
  <desc id="desc">A Windows 95 window introducing Sloppy Keyboard.</desc>
  <rect width="960" height="190" fill="#008080"/>
  <rect x="18" y="16" width="924" height="158" fill="#c0c0c0" stroke="#000" stroke-width="3"/>
  <path d="M18 174V16H942" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="24" y="22" width="912" height="31" fill="#000080"/>
  <text x="36" y="44" fill="#fff" font-family="Tahoma, Verdana, sans-serif" font-size="17" font-weight="700">⌨ Sloppy Keyboard — Welcome!</text>
  <g font-family="Tahoma, Verdana, sans-serif" font-weight="700" text-anchor="middle" fill="#000">
    <rect x="847" y="26" width="25" height="22" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <path d="M872 26V48H847" fill="none" stroke="#000" stroke-width="2"/>
    <text x="860" y="43" font-size="15">_</text>
    <rect x="876" y="26" width="25" height="22" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <path d="M901 26V48H876" fill="none" stroke="#000" stroke-width="2"/>
    <text x="889" y="43" font-size="13">□</text>
    <rect x="905" y="26" width="25" height="22" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <path d="M930 26V48H905" fill="none" stroke="#000" stroke-width="2"/>
    <text x="918" y="43" font-size="15">×</text>
  </g>
  <text x="36" y="73" fill="#000" font-family="Tahoma, Verdana, sans-serif" font-size="14"><tspan text-decoration="underline">F</tspan>ile　 <tspan text-decoration="underline">V</tspan>iew　 <tspan text-decoration="underline">H</tspan>elp</text>
  <text x="480" y="118" fill="#000" font-family="Impact, Haettenschweiler, sans-serif" font-size="42" text-anchor="middle">SLOPPY KEYBOARD</text>
  <text x="480" y="146" fill="#000080" font-family="Tahoma, Verdana, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Every keypress deserves a little drama.</text>
  <rect x="25" y="152" width="910" height="16" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <text x="33" y="165" fill="#000" font-family="'Courier New', monospace" font-size="11">READY · PROBABLY</text>
</svg>
